name: Step 2

on:
  # Manual re-run for facilitators and testing. Choose the implement-dependent-privacy branch.
  workflow_dispatch:
  # The learner pushes the implementation to the same branch; only the enabled step workflow runs.
  # No paths filter, so every push gets feedback, including one that only restores protected files.
  push:
    branches:
      - implement-dependent-privacy

# Least privilege: no default permissions; each job asks only for what it uses.
permissions: {}

# A quick second push cancels the run it supersedes instead of grading twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  STEP_3_FILE: ".github/steps/3-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read # read the learner's files
      issues: write # update Mona's feedback comment
      # No actions: write. A learner-triggered job must not enable or disable workflows.
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # compare protected files with main

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot] # never target the learner's own comment
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # START: Check practical exercise

      - name: Check the tests still name every scenario ID
        id: check-test-ids
        continue-on-error: true
        env:
          SCENARIO_IDS: "001-US3-AS1 001-US3-AS2 001-US3-AS3 001-US3-AS4 001-US3-AS5 001-US3-AS6"
        run: |
          files=$(find tests -maxdepth 1 -type f -name '*.test.js' 2>/dev/null | sort || true)
          [ -n "$files" ] || { echo "No tests/*.test.js file was found"; exit 1; }
          missing=""
          for id in $SCENARIO_IDS; do
            cat $files | tr -d '\r' | grep -qE "${id}([^0-9]|$)" || missing="$missing $id"
          done
          [ -z "$missing" ] || { echo "Missing from the tests:$missing"; exit 1; }

      - name: Check the unit tests pass
        id: check-unit-tests
        continue-on-error: true
        run: npm run test:unit

      - name: Check the Gherkin feature passes
        id: check-bdd
        continue-on-error: true
        run: npm run test:bdd

      - name: Check specs, features and supplied code are unchanged
        id: check-protected-unchanged
        continue-on-error: true
        run: |
          base=origin/main
          git rev-parse -q --verify "$base" > /dev/null || base=main
          changed=$(git diff --name-only "$base" -- features openspec src/claim-status.js ':(exclude)openspec/changes/implement-dependent-privacy/tasks.md')
          [ -z "$changed" ] || { echo "Changed compared with main:"; echo "$changed"; exit 1; }

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          # Tips render only when a check failed. Keep tip text free of single quotes.
          vars: |
            step_number: 2
            results_table:
              - description: "The tests still name all six scenario IDs"
                passed: ${{ steps.check-test-ids.outcome == 'success' }}
              - description: "npm run test:unit passes"
                passed: ${{ steps.check-unit-tests.outcome == 'success' }}
              - description: "npm run test:bdd passes"
                passed: ${{ steps.check-bdd.outcome == 'success' }}
              - description: "features/, openspec/ and src/claim-status.js match main (ticking tasks.md is fine)"
                passed: ${{ steps.check-protected-unchanged.outcome == 'success' }}
            tips: ${{ contains(steps.*.outcome, 'failure') && '["Run npm test in your codespace and fix the first failure in src/claim-visibility.js, not in the tests.", "Restore protected files with git restore --source main -- features openspec src/claim-status.js, then git add features openspec src/claim-status.js, commit and push.", "Open the failed check in the Actions tab to read the full test output.", "Commit and push to implement-dependent-privacy again."]' || '[]' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work] # grading must gate progress
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout step content
      actions: write # disable this step and enable the next one
      issues: write # post step content and progress comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
