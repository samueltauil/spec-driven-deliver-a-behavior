name: Step 5 # Last step of the exercise

on:
  # Manual re-run for facilitators and testing.
  workflow_dispatch:
  # The learner merges the pull request. Closing it without merging does nothing (see the guard below).
  pull_request:
    branches:
      - main
    types:
      - closed

# Least privilege: no default permissions; each job asks only for what it uses.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    # Ungraded: the merge is the evidence. Closing without merging must not finish the exercise.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Find Exercise Issue
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  post_review_content:
    name: Post review content
    needs: [find_exercise]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout review content
      actions: write # disable this final workflow
      issues: write # post the review comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Disable current workflow
        run: gh workflow disable "${{ github.workflow }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    permissions:
      contents: write # the toolkit commits the congratulations README
      issues: write # the toolkit comments on and closes the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Deliver an Approved Behavior with Copilot"
