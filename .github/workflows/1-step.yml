name: Step 1

on:
  # Manual re-run for facilitators and testing.
  workflow_dispatch:
  # The learner pushes the plan and the failing tests to a branch that does not exist in the template.
  push:
    branches:
      - implement-dependent-privacy
    paths:
      - delivery/**
      - tests/**

# Least privilege: no default permissions; each job asks only for what it uses.
permissions: {}

# A quick second push cancels the run it supersedes instead of grading twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  STEP_2_FILE: ".github/steps/2-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read # read the learner's files
      issues: write # update Mona's feedback comment
      # No actions: write. A learner-triggered job must not enable or disable workflows.
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot] # never target the learner's own comment
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      # START: Check practical exercise
      # The tests run against the stub, so they are expected to fail here. Only names and files are checked.

      - name: Check the plan maps every scenario ID
        id: check-plan-ids
        continue-on-error: true
        env:
          SCENARIO_IDS: "001-US3-AS1 001-US3-AS2 001-US3-AS3 001-US3-AS4 001-US3-AS5 001-US3-AS6"
        run: |
          [ -f delivery/plan.md ] || { echo "delivery/plan.md was not found"; exit 1; }
          missing=""
          for id in $SCENARIO_IDS; do
            tr -d '\r' < delivery/plan.md | grep -qE "${id}([^0-9]|$)" || missing="$missing $id"
          done
          [ -z "$missing" ] || { echo "Missing from delivery/plan.md:$missing"; exit 1; }

      - name: Check the plan records a human review
        id: check-plan-review
        continue-on-error: true
        run: |
          [ -f delivery/plan.md ] || { echo "delivery/plan.md was not found"; exit 1; }
          value=$(tr -d '\r' < delivery/plan.md | grep -iE 'reviewed by:' | tail -n 1 | sed -E 's/^.*[Rr][Ee][Vv][Ii][Ee][Ww][Ee][Dd] [Bb][Yy]:[*_]*[[:space:]]*//; s/[*_[:space:]]+$//')
          echo "Reviewed by: ${value:-none}"
          case "$value" in "<"*) echo "Replace the placeholder with your role"; exit 1 ;; esac
          [ "${#value}" -ge 2 ]

      - name: Check a unit test file exists
        id: check-tests-exist
        continue-on-error: true
        run: |
          files=$(find tests -maxdepth 1 -type f -name '*.test.js' 2>/dev/null | sort || true)
          echo "Test files: ${files:-none}"
          [ -n "$files" ]

      - name: Check the tests name every scenario ID
        id: check-test-ids
        continue-on-error: true
        env:
          SCENARIO_IDS: "001-US3-AS1 001-US3-AS2 001-US3-AS3 001-US3-AS4 001-US3-AS5 001-US3-AS6"
        run: |
          files=$(find tests -maxdepth 1 -type f -name '*.test.js' 2>/dev/null | sort || true)
          [ -n "$files" ] || { echo "No tests/*.test.js file was found"; exit 1; }
          missing=""
          for id in $SCENARIO_IDS; do
            cat $files | tr -d '\r' | grep -qE "${id}([^0-9]|$)" || missing="$missing $id"
          done
          [ -z "$missing" ] || { echo "Missing from the tests:$missing"; exit 1; }

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          # Tips render only when a check failed. Keep tip text free of single quotes.
          vars: |
            step_number: 1
            results_table:
              - description: "delivery/plan.md maps all six scenario IDs, 001-US3-AS1 to 001-US3-AS6"
                passed: ${{ steps.check-plan-ids.outcome == 'success' }}
              - description: "delivery/plan.md has a Reviewed by line with your role"
                passed: ${{ steps.check-plan-review.outcome == 'success' }}
              - description: "A unit test file exists in tests/ with a name ending in .test.js"
                passed: ${{ steps.check-tests-exist.outcome == 'success' }}
              - description: "The tests name all six scenario IDs"
                passed: ${{ steps.check-test-ids.outcome == 'success' }}
            tips: ${{ contains(steps.*.outcome, 'failure') && '["Open the failed check in the Actions tab to see which scenario IDs are missing, then add them to the plan or the test names.", "Write your role after Reviewed by: in the Human review section at the end of delivery/plan.md, and delete any other Reviewed by line.", "Save the tests as tests/claim-visibility.test.js and start each test name with its scenario ID.", "Commit and push to implement-dependent-privacy again."]' || '[]' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work] # grading must gate progress
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout step content
      actions: write # disable this step and enable the next one
      issues: write # post step content and progress comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 2

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_2_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 2"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
