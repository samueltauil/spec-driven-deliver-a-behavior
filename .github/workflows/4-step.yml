name: Step 4

on:
  # Manual re-run for facilitators and testing. Choose the implement-dependent-privacy branch.
  workflow_dispatch:
  # The learner pushes the archived change to the pull request's branch.
  push:
    branches:
      - implement-dependent-privacy
    paths:
      - openspec/**

# Least privilege: no default permissions; each job asks only for what it uses.
permissions: {}

# A quick second push cancels the run it supersedes instead of grading twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  STEP_5_FILE: ".github/steps/5-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    permissions:
      issues: read # locate the exercise issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    permissions:
      contents: read # read the learner's files
      issues: write # update Mona's feedback comment
      # No actions: write. A learner-triggered job must not enable or disable workflows.
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot] # never target the learner's own comment
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the OpenSpec CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      # START: Check practical exercise

      - name: Check the living spec holds the new requirements
        id: check-living-spec
        continue-on-error: true
        run: |
          spec=openspec/specs/member-claim-privacy/spec.md
          [ -f "$spec" ] || { echo "$spec was not found"; exit 1; }
          missing=""
          for id in 001-FR-011 001-FR-012 001-FR-013; do
            tr -d '\r' < "$spec" | grep -qE "^### Requirement: ${id}[[:space:]]*$" || missing="$missing $id"
          done
          [ -z "$missing" ] || { echo "Missing from $spec:$missing"; exit 1; }

      - name: Check the active change folder is gone
        id: check-change-archived
        continue-on-error: true
        run: |
          [ ! -e openspec/changes/implement-dependent-privacy ] || { echo "openspec/changes/implement-dependent-privacy still exists"; exit 1; }

      - name: Check there is exactly one dated archive folder
        id: check-archive-folder
        continue-on-error: true
        run: |
          dirs=$(find openspec/changes/archive -mindepth 1 -maxdepth 1 -type d -name '*implement-dependent-privacy' 2>/dev/null | sort || true)
          echo "Archive folders: ${dirs:-none}"
          [ "$(echo "$dirs" | grep -c .)" -eq 1 ] || exit 1
          basename "$dirs" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-implement-dependent-privacy$' || { echo "The folder name must start with a date, YYYY-MM-DD"; exit 1; }
          [ -f "$dirs/proposal.md" ] || { echo "proposal.md is missing from $dirs"; exit 1; }

      - name: Check strict OpenSpec validation passes
        id: check-validate
        continue-on-error: true
        env:
          OPENSPEC_TELEMETRY: 0
        run: npx --no -- openspec validate --all --strict --no-interactive

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          # Tips render only when a check failed. Keep tip text free of single quotes.
          vars: |
            step_number: 4
            results_table:
              - description: "openspec/specs/member-claim-privacy/spec.md holds 001-FR-011, 001-FR-012 and 001-FR-013"
                passed: ${{ steps.check-living-spec.outcome == 'success' }}
              - description: "The active change folder openspec/changes/implement-dependent-privacy is gone"
                passed: ${{ steps.check-change-archived.outcome == 'success' }}
              - description: "openspec/changes/archive holds exactly one dated implement-dependent-privacy folder"
                passed: ${{ steps.check-archive-folder.outcome == 'success' }}
              - description: "openspec validate --all --strict passes"
                passed: ${{ steps.check-validate.outcome == 'success' }}
            tips: ${{ contains(steps.*.outcome, 'failure') && '["Stage the whole folder with git add openspec so the move is committed, then commit and push.", "If openspec/changes/implement-dependent-privacy still exists, run npx openspec archive implement-dependent-privacy from the repository folder and answer y to Proceed with spec updates.", "If two archive folders exist, keep one and remove the other with git rm -r."]' || '[]' }}

      # END: Check practical exercise

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work] # grading must gate progress
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout step content
      actions: write # disable this step and enable the next one
      issues: write # post step content and progress comments
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 5

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_5_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 5"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
